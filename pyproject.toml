[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-banking-assistant"
version = "0.1.0"
description = "Agentic AI Smart Banking Assistant"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "pytest",
    "pytest-asyncio",
    "httpx",
    "psycopg-pool>=3.3.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.1",
    "docling>=2.120.1",
    "sentence-transformers>=5.7.0",
    "python-multipart>=0.0.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
